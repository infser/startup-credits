    program_id: prg_01m1fqkzp009pm6dxaq0w8tht4
    offer_slug: up-to-1cr-startup-perks-payment-credits
    offer_slug_aliases: []
    title: Up to ₹1 Cr in Startup Perks payment credits and benefits
    summary: Funded Indian startups new to Razorpay can get up to ₹30L in domestic and ₹20L in international payment credits, free Magic Checkout for up to 6 months, 3 months of free payroll, and card SaaS benefits.
    description: VC-funded startups get the higher amounts; angel-funded startups get up to ₹3L each in domestic and international payment credits, 90 days of Magic Checkout, and up to ₹20L in card SaaS benefits. Amounts are subject to Razorpay's risk assessment and underwriting, and Razorpay may provide a lesser offer; payment credits are applied first come, first served.
    lifecycle:
      status: active
      effective_from: 2026-09-02T00:14:00.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: Up to ₹30 lakh in free domestic payment credits for VC-funded startups (up to ₹3 lakh for angel-funded), valid until the offer limit is reached or 3 months from activation
          kind: credit
          value:
            amount:
              currency: INR
              minor_units: 300000000
            kind: up-to
          duration:
            kind: up-to
            value: P3M
        - benefit_id: ben_02
          description: Up to ₹20 lakh in free international payment credits for VC-funded startups (up to ₹3 lakh for angel-funded), valid until the offer limit is reached or 3 months from activation
          kind: credit
          value:
            amount:
              currency: INR
              minor_units: 200000000
            kind: up-to
          duration:
            kind: up-to
            value: P3M
        - benefit_id: ben_03
          description: Magic Checkout free for 6 months for VC-funded startups, or 90 days for angel-funded startups
          kind: free-service
          service: Razorpay Magic Checkout
          duration:
            kind: up-to
            value: P6M
        - benefit_id: ben_04
          description: 1 year of free intelligent payment routing for VC-funded startups
          kind: free-service
          service: Razorpay intelligent payment routing
          duration:
            kind: exact
            value: P1Y
        - benefit_id: ben_05
          description: First 3 months of Razorpay payroll free
          kind: free-service
          service: Razorpay payroll
          duration:
            kind: exact
            value: P3M
        - benefit_id: ben_06
          description: Collateral-free corporate credit card with up to ₹50 lakh worth of SaaS benefits for VC-funded startups (up to ₹20 lakh for angel-funded), subject to credit underwriting
          kind: other
        - benefit_id: ben_07
          description: Dedicated manager and round-the-clock support
          kind: other
      consideration:
        kind: none
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: external-verification
            statement: The startup is funded (seed-funded, backed by angel investors, Shark Tank-funded, or has raised Series A to Series C rounds) and provides satisfactory proof of its VC or angel funding.
          - criterion_id: cri_02
            kind: manual
            reason: external-verification
            statement: The startup is registered and operating in India.
          - criterion_id: cri_03
            kind: manual
            reason: external-verification
            statement: The startup is a new merchant that hasn't actively used the Razorpay ecosystem in the past 3 months or more.
